version: '3.8'

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: clinica-db-prod
    restart: always
    environment:
      POSTGRES_DB: clinica_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    # NOTA: En producción NO se mapean los puertos de la BD hacia fuera (sin 'ports:')

  # Backend PHP-FPM (Procesador)
  backend:
    build:
      context: ./clinica-backend
      dockerfile: Dockerfile.prod
    container_name: clinica-backend-prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://app.bratox.me
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: clinica_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
    depends_on:
      - db

  # Servidor Web para el Backend (Nginx)
  backend-web:
    image: nginx:alpine
    container_name: clinica-backend-web
    restart: always
    ports:
      - "8080:80"  # Cambiamos a 8080 para evitar conflictos con el puerto 8000 del servidor
    volumes:
      - ./clinica-backend:/var/www/html:ro  # Nginx necesita leer los estáticos public/
      - ./clinica-backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Servidor Web para el Frontend (React/Vite)
  frontend:
    build:
      context: ./clinica-frontend
      dockerfile: Dockerfile.prod
    container_name: clinica-frontend-prod
    restart: always
    ports:
      - "80:80"  # Expone el frontend en el puerto 80 nativo para NPM
    # Las variables de entorno (.env.production) se inyectaron durante el build

volumes:
  db_data:
